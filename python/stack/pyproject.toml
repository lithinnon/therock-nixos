# therock-nixos' ROCm torch stack (AMD TheRock), swapped into pytorchProject
# venvs for the PyPI torch of a plain uv.lock. One extra per GPU target; the
# lock is hashed for every target in the manifest (`nix run .#stack-lock`).
[project]
name = "therock-torch"
version = "0"
requires-python = "==3.14.*"
dependencies = [
  "torch==2.15.*",
  # AMD's torchvision wheels don't pin torch; keep these two in step.
  "torchvision>=0.29.2,<0.30",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "therock"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[project.optional-dependencies]
gfx1010 = ["torch[device-gfx1010]", "torchvision[device-gfx1010]"]
gfx1011 = ["torch[device-gfx1011]", "torchvision[device-gfx1011]"]
gfx1012 = ["torch[device-gfx1012]", "torchvision[device-gfx1012]"]
gfx1030 = ["torch[device-gfx1030]", "torchvision[device-gfx1030]"]
gfx1031 = ["torch[device-gfx1031]", "torchvision[device-gfx1031]"]
gfx1032 = ["torch[device-gfx1032]", "torchvision[device-gfx1032]"]
gfx1033 = ["torch[device-gfx1033]", "torchvision[device-gfx1033]"]
gfx1034 = ["torch[device-gfx1034]", "torchvision[device-gfx1034]"]
gfx1035 = ["torch[device-gfx1035]", "torchvision[device-gfx1035]"]
gfx1036 = ["torch[device-gfx1036]", "torchvision[device-gfx1036]"]
gfx1100 = ["torch[device-gfx1100]", "torchvision[device-gfx1100]"]
gfx1101 = ["torch[device-gfx1101]", "torchvision[device-gfx1101]"]
gfx1102 = ["torch[device-gfx1102]", "torchvision[device-gfx1102]"]
gfx1103 = ["torch[device-gfx1103]", "torchvision[device-gfx1103]"]
gfx1150 = ["torch[device-gfx1150]", "torchvision[device-gfx1150]"]
